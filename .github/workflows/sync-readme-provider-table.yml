name: Sync README provider table

on:
  schedule:
    # 08:00 Asia/Shanghai (GitHub Actions uses UTC).
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync provider table from result API
        run: node scripts/sync-readme-provider-table.mjs

      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md README.zh-CN.md; then
            echo "README provider tables are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md
          git commit -m "docs: sync provider table"
          git push
